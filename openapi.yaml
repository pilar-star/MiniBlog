openapi: 3.1.1
info:
  title: Mini Blog API
  version: 1.0.0
  description: API REST para gestionar autores y posts de un blog
  contact:
    name: Pilar Lugones
    email: example@blog.com

servers:
  - url: http://localhost:3000
    description: Servidor local de desarrollo
  - url: https://blog-api-production.up.railway.app
    description: Servidor de producción

components:
  schemas:
    Author:
      type: object
      properties:
        id:
          type: integer
          description: ID único del autor
        name:
          type: string
          description: Nombre del autor
        email:
          type: string
          format: email
          description: Correo electrónico del autor (debe ser único)
        bio:
          type: string
          description: Biografía del autor (opcional)
        created_at:
          type: string
          format: date-time
          description: Fecha de creación

    Error:
      type: object
      properties:
        error:
          type: string
          description: Mensaje de error

paths:
  /authors:
    get:
      summary: Obtener todos los autores
      description: Devuelve una lista de todos los autores registrados
      tags:
       - Autores
      responses:
        '200':
          description: Lista de autores obtenida exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Author'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Crear un nuevo autor
      tags:
       - Autores
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
              properties:
                name:
                  type: string
                  description: Nombre del autor
                email:
                  type: string
                  format: email
                  description: Correo electrónico del autor (debe ser único)
                bio:
                  type: string
                  description: Biografía del autor (opcional)
      responses:
        '201':
          description: Autor creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email ya existente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /authors/{id}:
    get:
      summary: Obtener un autor por ID
      tags:
       - Autores
      parameters:
        - name: id
          in: path
          required: true
          description: ID del autor a obtener
          schema:
            type: integer
      responses:
        '200':
          description: Autor obtenido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '404':
          description: Autor no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Actualizar un autor por ID
      tags:
       - Autores
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID del autor a actualizar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Nombre del autor (opcional)
                email:
                  type: string
                  format: email
                  description: Correo electrónico del autor (debe ser único, opcional)
                bio:
                  type: string
                  description: Biografía del autor (opcional)
      responses:
        '200':
          description: Autor actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Autor no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email ya existente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Eliminar un autor por ID
      tags:
       - Autores
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID del autor a eliminar
      responses:
        '204':
          description: Autor eliminado exitosamente (sin contenido)
        '404':
          description: Autor no encontrado

  /posts:
    get:
      summary: Obtener todos los posts
      description: Devuelve una lista de todos los posts registrados
      tags:
       - Posts
      responses:
        '200':
          description: Lista de posts obtenida exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Crear un nuevo post
      tags:
       - Posts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Post'
      responses:
        '201':
          description: Post creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /posts/{id}:
    get:
      summary: Obtener un post por ID
      tags:
       - Posts
      parameters:
        - name: id
          in: path
          required: true
          description: ID del post a obtener
          schema:
            type: integer
      responses:
        '200':
          description: Post obtenido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          description: Post no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Actualizar un post por ID
      tags:
       - Posts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID del post a actualizar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Post'
      responses:
        '200':
          description: Post actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Eliminar un post por ID
      tags:
       - Posts
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID del post a eliminar
      responses:
        '204':
          description: Post eliminado exitosamente (sin contenido)
        '404':
          description: Post no encontrado

  /posts/author/{author_id}:
    get:
      summary: Obtener posts por ID de autor
      tags:
       - Posts
      parameters:
        - name: author_id
          in: path
          required: true
          description: ID del autor cuyos posts se desean obtener
          schema:
            type: integer
      responses:
        '200':
          description: Lista de posts del autor obtenida exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        '404':
          description: Autor no encontrado o sin posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'